services:
  push:
    build:
      context: .
      network: host
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8765:8000"
    networks:
      default:
      ingress:
        aliases:
          - timetracker-push
    volumes:
      - ./data:/sandbox/data:rw
      - ./secrets:/sandbox/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  ingress:
    external: true
    name: paike_default
