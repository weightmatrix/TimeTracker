# Insert inside the HTTPS server block for zhibenwang.com.
# The TimeTracker service joins the existing paike_default Docker network.
location ^~ /time-push/ {
    access_log off;
    client_max_body_size 16k;
    proxy_pass http://timetracker-push:8000/;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
